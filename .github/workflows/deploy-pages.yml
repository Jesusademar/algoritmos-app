name: Publicar LogiVerse en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Verificar y compilar la app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Obtener el proyecto
        uses: actions/checkout@v6

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Revisar el código
        run: flutter analyze

      - name: Ejecutar pruebas
        run: flutter test

      - name: Obtener la ruta de GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Compilar para la dirección publicada
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: flutter build web --release --base-href "${PAGES_BASE_PATH}/"

      - name: Preparar los archivos del sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Publicar el sitio
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
